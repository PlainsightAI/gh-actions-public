name: 'Publish Docker Image to GAR'
description: 'Builds and publishes a Docker image to Google Artifact Registry'

inputs:
  version:
    description: 'Override the version from the VERSION file'
    required: false
    default: ''
  image:
    description: 'Override the default IMAGE path'
    required: false
    default: ''
  working-directory:
    description: 'Working directory to run the build and publish commands'
    required: false
    default: '.'
  environment:
    description: 'Environment to authenticate to (production, staging, development)'
    required: false
    default: 'production'
  attest_tlog:
    description: >
      Whether the SBOM attestation is uploaded to the public Rekor transparency
      log. Default 'true' keeps published images publicly verifiable. Set 'false'
      to skip the public log for images whose reference and SBOM should not be
      recorded in a public, permanent, append-only log. Keyless signing is
      unaffected either way; only the transparency-log upload is skipped.
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Override VERSION (if provided)
      if: inputs.version != ''
      shell: bash
      run: |
        echo "Overriding VERSION with: ${{ inputs.version }}"
        echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV

    - name: Override IMAGE (if provided)
      if: inputs.image != ''
      shell: bash
      run: |
        echo "Overriding IMAGE with: ${{ inputs.image }}"
        echo "IMAGE=${{ inputs.image }}" >> $GITHUB_ENV

    # TODO: Pin this floating '@main' ref to a tagged release or stable SHA for production safety
    - name: Authenticate to Google Cloud
      uses: PlainsightAI/gh-actions-public/google-cloud-auth@main
      with:
        environment: ${{ inputs.environment }}

    - name: Configure Docker for GAR
      shell: bash
      run: |
        gcloud auth configure-docker us-west1-docker.pkg.dev

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build docker image
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        make build-image

    - name: Push docker image
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        make publish-image

    # ----- Supply-chain: SBOM + signed attestation (opt-in) -----------------
    # Generate an SPDX SBOM and attach it as a keyless, signed in-toto attestation
    # (Sigstore, via the job's GitHub OIDC token — no long-lived key), so a scanner
    # can re-check the released image from its SBOM without pulling it.
    #
    # Opt-in and non-breaking: resolve the ref(s) first; if the caller granted no
    # id-token, or exposes no ref, this warns and skips — and the installs below skip
    # too. A repo enables coverage by granting `permissions: id-token: write` AND exposing
    # its pushed ref(s): a `print-image-refs` make target (newline-separated, for repos
    # that push more than one image) or IMAGE + VERSION in the job env.
    - name: Resolve SBOM attest refs
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::warning::SBOM attestation skipped: caller job has no 'id-token: write'. Add it (and a print-image-refs target or IMAGE/VERSION env) to enable keyless cosign attestation."
          echo "attest=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        refs=""
        if make -n print-image-refs >/dev/null 2>&1; then
          refs="$(make -s print-image-refs)"
        elif [ -n "${IMAGE:-}" ] && [ -n "${VERSION:-}" ]; then
          refs="${IMAGE}:${VERSION}"
        fi
        if [ -z "${refs//[[:space:]]/}" ]; then
          echo "::warning::SBOM attestation skipped: could not determine the pushed image ref (add a 'print-image-refs' make target or set IMAGE and VERSION in the job env)."
          echo "attest=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Validate each ref up front so an unusable one fails HERE, naming the ref, rather
        # than as an opaque syft parse error after the image is already pushed. Strip any
        # @digest first (name:tag@sha256:... is a valid pinned reference), then the name
        # segment (after the last '/') must be `name[:tag]`; a second colon there means IMAGE
        # already embedded a tag (ref resolves to `name:tag:version`), which syft rejects.
        while IFS= read -r ref; do
          [ -n "${ref//[[:space:]]/}" ] || continue
          seg="${ref##*/}"; seg="${seg%%@*}"; colons="${seg//[^:]/}"
          if [ "${#colons}" -gt 1 ]; then
            echo "::error::SBOM attestation: resolved ref '$ref' is not a valid image reference (name segment '${ref##*/}' has an extra colon). Fix 'make print-image-refs' / the IMAGE variable to emit 'registry/repo:tag' — IMAGE likely already carries a tag."
            exit 1
          fi
        done <<< "$refs"
        {
          echo "attest=true"
          echo "refs<<__REFS_EOF__"
          echo "$refs"
          echo "__REFS_EOF__"
        } >> "$GITHUB_OUTPUT"
    # These two run in a job holding id-token: write and cosign signs, so a compromised
    # mutable tag could mint a Fulcio cert as the caller's identity — pin by commit SHA
    # (the load-bearing exception to floating tags). cosign-release pins the cosign binary;
    # syft-version pins the SBOM generator. Skipped when there is nothing to attest.
    # continue-on-error: these and the attest below run AFTER `make publish-image` has pushed,
    # so a release-asset download or signing outage must not fail the caller's publish job over
    # an image that is already live. (The Resolve step above is NOT continue-on-error — a bad
    # ref is a real error worth failing on, and nothing is pushed yet at that point.)
    - name: Install cosign
      if: steps.resolve.outputs.attest == 'true'
      continue-on-error: true
      uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      with:
        cosign-release: v2.5.2
    - name: Install syft
      if: steps.resolve.outputs.attest == 'true'
      continue-on-error: true
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        syft-version: v1.50.0
    - name: SBOM + keyless attest
      if: steps.resolve.outputs.attest == 'true'
      continue-on-error: true
      shell: bash
      env:
        ATTEST_TLOG: ${{ inputs.attest_tlog }}
        REFS: ${{ steps.resolve.outputs.refs }}
      run: |
        set -euo pipefail
        # attest_tlog=false skips the public transparency-log upload (keyless signing is
        # unchanged) for callers that must not record an image's ref/SBOM in a public log.
        tlog_flag=(); [ "$ATTEST_TLOG" = "false" ] && tlog_flag=(--tlog-upload=false)
        # This wraps `make publish-image` and does not know the built platforms, so it
        # catalogs one SBOM per ref — the host platform of a manifest-list. It assumes
        # single-platform images (see the README); a multi-arch image would attest only one
        # architecture. syft catalogs the image at $ref.
        while IFS= read -r ref; do
          [ -n "${ref//[[:space:]]/}" ] || continue
          echo "Attesting SBOM for $ref"
          syft "$ref" -o spdx-json=sbom.spdx.json
          # --type spdxjson sets predicateType https://spdx.dev/Document (scanner filter).
          cosign attest --yes "${tlog_flag[@]}" --type spdxjson --predicate sbom.spdx.json "$ref"
        done <<< "$REFS"
