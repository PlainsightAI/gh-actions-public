name: "Open Mechanical PR"
description: |
  Opens a bot-authored pull request from working-tree changes (modifications
  and untracked files). Supersedes any open PRs whose head branch shares the
  configured prefix, commits + pushes a fresh branch named
  ${branch_prefix}${short_sha}-${github_run_id}, opens the PR, and then merges
  it per `merge_mode`: 'auto' (default) enables GitHub native auto-merge;
  'ci-gated' polls the PR's CI and bypass-merges on green as a ruleset bypass
  actor (and exits nonzero on failure/timeout so the caller can alert).
  Idempotent: a clean working tree exits successfully without doing anything.

  Lifted from the supersede + push + create logic of client-portal's
  update-api-client.yaml so cascade workflows (openfilter, gh-actions, …)
  share one implementation.

inputs:
  repo:
    description: "Target consumer repo in owner/name form (e.g. PlainsightAI/filter-sam3-detector)."
    required: true
  branch_prefix:
    description: |
      Branch prefix for the bot PR head (e.g. bump-openfilter-, bump-gh-actions-).
      Used both for the new branch name (${branch_prefix}${short_sha}-${github_run_id})
      and to identify open predecessors to supersede. Pick a prefix unique to
      the cascade so unrelated bot PRs are not closed.
    required: true
  commit_message:
    description: "Commit message for the staged changes."
    required: true
  pr_title:
    description: "Pull request title."
    required: true
  pr_body:
    description: "Pull request body (markdown)."
    required: true
  gh_token:
    description: |
      GitHub token (plainsight-bot PAT) used for git push, PR creation,
      auto-merge enablement, and listing/closing prior PRs in the supersede
      step. Must have `repo` scope (or equivalent fine-grained
      `Pull requests: read+write` and `Contents: read+write`) on every repo
      this action targets.
    required: true
  auto_merge:
    description: "Set to 'false' to skip 'gh pr merge --auto'. Defaults to 'true'."
    required: false
    default: 'true'
  merge_method:
    description: "Merge method passed to 'gh pr merge': squash | merge | rebase."
    required: false
    default: 'squash'
  merge_mode:
    description: |
      How the bot PR is merged once opened:
        - 'auto' (default): enable GitHub native auto-merge
          (`gh pr merge --auto`). GitHub merges when the target branch's
          protection is satisfied. This is the legacy behaviour and is a
          soft no-op on repos with no branch protection.
        - 'ci-gated': poll the PR's own CI checks to a terminal state, then
          on all-green call the REST merge endpoint
          (`PUT /repos/{owner}/{repo}/pulls/{n}/merge`) as an *immediate*
          merge performed by the bot, which the org/repo ruleset honors
          because the bot is a configured `bypass_actor` (mode: always). This
          is a scoped ruleset bypass, NOT a repo-admin override. (`gh pr merge`
          is unusable here: its preflight refuses the merge on unmet required
          reviews even for a bypass-authorized caller — cli/cli#13388.) On any
          failed/cancelled check, or if CI does not finish within
          `ci_poll_timeout_seconds`, leave the PR open and exit nonzero so the
          caller's failure-notify job fires.
      Use 'ci-gated' where an org ruleset requires reviews that native
      auto-merge cannot satisfy: native auto-merge (`gh pr merge --auto`) is a
      deferred merge that does NOT honor `bypass_actors`, so an immediate
      bypass-actor merge is required. Only takes effect when `auto_merge` is
      'true'.
    required: false
    default: 'auto'
  ci_poll_timeout_seconds:
    description: |
      ci-gated mode only. Maximum seconds to poll the consumer PR's CI
      before giving up. On timeout the PR is left open and the step exits
      nonzero. Defaults to 600 (10 minutes).
    required: false
    default: '600'
  ci_poll_interval_seconds:
    description: |
      ci-gated mode only. Seconds to sleep between CI check polls.
      Defaults to 15.
    required: false
    default: '15'
  no_checks_grace_seconds:
    description: |
      ci-gated mode only. When a PR reports no checks at all, wait this
      many seconds (re-polling) before concluding the repo genuinely has no
      CI and treating the PR as green. Guards against a race where CI has
      not yet registered its checks on a just-opened PR. Defaults to 30.
    required: false
    default: '30'
  base_branch:
    description: |
      Base branch the PR targets and the supersede step queries against.
      Defaults to `main`.
    required: false
    default: 'main'
  working_directory:
    description: "Path to the cloned consumer repo on the runner. Defaults to the current directory."
    required: false
    default: '.'

outputs:
  pr_url:
    description: "URL of the created pull request. Empty if the working tree was clean (no-op)."
    value: ${{ steps.create_pr.outputs.pr_url }}

runs:
  using: "composite"
  steps:
    - name: Configure git identity and check for changes
      id: precheck
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        MERGE_METHOD: ${{ inputs.merge_method }}
        MERGE_MODE: ${{ inputs.merge_mode }}
      run: |
        # Validate merge_method unconditionally — even when auto_merge is
        # 'false', so that a typo in test runs that disable auto-merge fails
        # fast rather than lurking until someone flips the flag.
        case "$MERGE_METHOD" in
          squash|merge|rebase) ;;
          *)
            echo "ERROR: invalid merge_method '$MERGE_METHOD' (expected squash|merge|rebase)."
            exit 1
            ;;
        esac

        # Same fail-fast rationale for merge_mode: catch a typo before any
        # branch/PR is created rather than after the PR is already open.
        case "$MERGE_MODE" in
          auto|ci-gated) ;;
          *)
            echo "ERROR: invalid merge_mode '$MERGE_MODE' (expected auto|ci-gated)."
            exit 1
            ;;
        esac

        git config user.name "plainsight-bot"
        git config user.email "cloudinfra@plainsight.ai"

        # Idempotency guard: a clean working tree means upstream's bump
        # strategy already converged (e.g. the consumer's pin already
        # satisfies the new version, or this run is a retry of a no-op).
        # Exit success and let downstream steps short-circuit on has_changes.
        # Use porcelain so untracked files (e.g. brand-new RELEASE.md) also
        # count as changes — git diff --quiet only checks tracked files.
        if [ -z "$(git status --porcelain)" ]; then
          echo "Working tree clean; nothing to commit."
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Supersede stale predecessor PRs
      if: steps.precheck.outputs.has_changes == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        BASE_BRANCH: ${{ inputs.base_branch }}
      run: |
        # Only one open cascade PR per prefix at a time. Filtering via jq
        # because gh pr list's --search head: qualifier is exact-match, not
        # prefix. --delete-branch keeps the remote tidy; superseded branches
        # have no other purpose. Pass the prefix via env (BRANCH_PREFIX) so
        # the jq query reads it from $ENV — never inline ${{ inputs.* }}
        # into a shell script (branch names can carry shell metacharacters).
        #
        # Run gh pr list as its own step rather than inline-piping into
        # mapfile: a process-substitution failure inside `mapfile -t … < <(…)`
        # is silently swallowed (mapfile returns 0 with an empty array), so
        # an auth-scope mismatch or transient API error would masquerade as
        # "no stale PRs" and let the cascade race against still-open
        # predecessors. The two-step form surfaces gh's exit code.
        #
        # On gh pr list failure: fail the shard rather than soft-fail. For
        # internal cascade targets with a scoped bot PAT, a non-zero exit
        # here means either a transient API blip (re-run clears it) or a
        # real bug (token scope, repo archived, repo renamed). Soft-failing
        # would let stale ${BRANCH_PREFIX}* PRs accumulate forever — the
        # supersede step silently never works while every cascade run opens
        # fresh PRs on top. Matrix callers should set fail-fast: false so
        # one shard's failure here doesn't block bumps to peers.
        if ! gh pr list \
              --repo "$REPO" \
              --state open \
              --base "$BASE_BRANCH" \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith(env.BRANCH_PREFIX)) | "\(.number)\t\(.headRefName)"' \
              > /tmp/stale_prs.txt; then
          echo "ERROR: failed to list open PRs in $REPO for supersede check."
          echo "ERROR: refusing to open a fresh PR on top of an unknown predecessor set."
          exit 1
        fi
        mapfile -t stale < /tmp/stale_prs.txt

        if [ "${#stale[@]}" -eq 0 ]; then
          echo "No stale ${BRANCH_PREFIX}* PRs to supersede."
          exit 0
        fi

        for entry in "${stale[@]}"; do
          [ -z "$entry" ] && continue
          num="${entry%%$'\t'*}"
          branch="${entry#*$'\t'}"
          echo "Closing #${num} (${branch}) — superseded by a fresh ${BRANCH_PREFIX} run."
          # Best-effort: a concurrent run may have already closed the PR;
          # don't let a 422 here abort the cascade.
          gh pr close "$num" \
            --repo "$REPO" \
            --delete-branch \
            --comment "Superseded by a fresh ${BRANCH_PREFIX} run." \
            || echo "WARN: failed to close #${num}; continuing."
        done

    - name: Commit and push branch
      id: push
      if: steps.precheck.outputs.has_changes == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        # Append GITHUB_RUN_ID so two truly concurrent cascade runs against
        # an unchanged consumer main don't race on push with identical
        # branch names (SHORT_SHA alone is deterministic per HEAD, not per
        # run). A re-run of the SAME workflow run keeps the same RUN_ID, so
        # the PR-existence probe below still handles retry idempotency.
        BRANCH_NAME="${BRANCH_PREFIX}${SHORT_SHA}-${GITHUB_RUN_ID}"

        # -B (force-create) instead of -b: a re-entrant invocation in the
        # same workspace (rare, but possible on persistent self-hosted
        # runners that share a checkout across jobs) would otherwise error
        # with "branch already exists". Safe here since we're freshly
        # pushing this branch in the next command anyway.
        git checkout -B "$BRANCH_NAME"
        git add -A
        # -s appends a Signed-off-by trailer using the user.name/user.email
        # configured by the caller (see action inputs above). Required so
        # the resulting PR passes the DCO probot check on repos where it
        # is installed; harmless on repos where it is not.
        git commit -s -m "$COMMIT_MESSAGE"

        # Push using the token in the URL — avoids mutating global git
        # config (which `gh auth setup-git` would do persistently on
        # self-hosted runners by writing a credential helper into
        # ~/.gitconfig that survives across jobs and can interfere with
        # other workflows that authenticate differently). The
        # `http.extraheader=` override defeats any persisted Authorization
        # header left by actions/checkout in callers that share a workspace.
        git -c "http.https://github.com/.extraheader=" \
            push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH_NAME"

        echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

    - name: Create pull request
      id: create_pr
      if: steps.precheck.outputs.has_changes == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        BRANCH_NAME: ${{ steps.push.outputs.branch_name }}
        PR_TITLE: ${{ inputs.pr_title }}
        PR_BODY: ${{ inputs.pr_body }}
      run: |
        # Probe for an existing PR for this exact branch first. A re-run of
        # the same workflow run reproduces the same SHORT_SHA + RUN_ID and
        # therefore the same BRANCH_NAME; the push above is a no-op or
        # fast-forward, but `gh pr create` would hard-fail with "a pull
        # request for branch X already exists". Reuse the existing PR
        # instead so retries are idempotent.
        PR_URL=$(gh pr list --repo "$REPO" --head "$BRANCH_NAME" --state open --json url --jq '.[0].url // ""')
        if [ -z "$PR_URL" ]; then
          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "$PR_BODY")
          echo "Opened: $PR_URL"
        else
          echo "Reusing existing PR: $PR_URL"
        fi
        echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

    - name: Enable native auto-merge
      if: steps.precheck.outputs.has_changes == 'true' && inputs.auto_merge == 'true' && inputs.merge_mode == 'auto'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        MERGE_METHOD: ${{ inputs.merge_method }}
      run: |
        # Native auto-merge: GitHub merges as soon as required checks +
        # reviews pass. Branch protection on the consumer's main is the
        # source of truth for "what does merge readiness mean here":
        #   - required checks (tests + dry-run-publish) → merges on green
        #   - required reviews                          → waits for review
        #   - no protection at all                      → gh errors
        #
        # The unprotected case is a soft warning, not a failure: the PR
        # still exists, a human can merge it manually. Failing the cascade
        # over a missing branch protection rule would block bumps from
        # landing in repos that haven't completed the protection sweep yet.
        #
        # merge_method validation lives in the precheck step so a typo
        # fails fast even when auto_merge is 'false'.
        if ! gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"; then
          echo "WARN: 'gh pr merge --auto --$MERGE_METHOD' failed for $PR_URL."
          echo "WARN: Likely cause: target branch has no protection rule, so auto-merge"
          echo "WARN: is not enabled for the repo. PR remains open for manual merge."
        fi

    - name: Poll CI then bypass-merge
      if: steps.precheck.outputs.has_changes == 'true' && inputs.auto_merge == 'true' && inputs.merge_mode == 'ci-gated'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        MERGE_METHOD: ${{ inputs.merge_method }}
        POLL_TIMEOUT: ${{ inputs.ci_poll_timeout_seconds }}
        POLL_INTERVAL: ${{ inputs.ci_poll_interval_seconds }}
        NO_CHECKS_GRACE: ${{ inputs.no_checks_grace_seconds }}
      run: |
        # ci-gated merge: native auto-merge (`gh pr merge --auto`) is a
        # deferred merge that does NOT honour an org ruleset's bypass_actors,
        # so mechanical bump PRs sit open forever waiting on a review that the
        # cascade is entitled to bypass. Instead we own the merge decision
        # here: poll THIS PR's CI to a terminal state, then merge via an
        # immediate call to the REST merge endpoint performed as a ruleset
        # bypass actor (bot team 4637420, bypass_mode always) only when
        # everything is green. The bypass applies because the merge is
        # immediate; the deferred `--auto` queue is ignored by bypass_actors.
        #
        # `set -e`/pipefail are on by default in composite bash steps. gh pr
        # checks exits nonzero while checks are pending (8) or failing (1) —
        # that is a status signal, not a command error, so every gh call that
        # can legitimately exit nonzero is guarded by `if`/`|| true` to keep
        # -e from aborting the poll.
        deadline=$(( $(date +%s) + POLL_TIMEOUT ))
        no_checks_since=""

        while :; do
          now=$(date +%s)
          if [ "$now" -ge "$deadline" ]; then
            echo "ERROR: CI did not reach a terminal state within ${POLL_TIMEOUT}s for $PR_URL."
            echo "ERROR: Leaving the PR open for a human; not bypass-merging."
            exit 1
          fi

          # Capture the checks JSON regardless of gh's status-derived exit
          # code. On failure we branch on WHY: a genuine "no checks reported"
          # message vs a transient API error (rate limit, 5xx, network).
          if checks_json=$(gh pr checks "$PR_URL" --json bucket,state 2>/tmp/gh_checks_err); then
            :
          else
            gh_rc=$?
            if grep -qi "no checks reported" /tmp/gh_checks_err; then
              # Distinct, expected condition: PR base has no configured checks.
              checks_json='[]'
            elif [ -z "${checks_json:-}" ]; then
              # Empty stdout + a non-"no checks" nonzero exit → transient.
              # Back off and retry; the overall deadline still bounds us.
              echo "WARN: transient 'gh pr checks' error (exit ${gh_rc}); retrying in ${POLL_INTERVAL}s."
              cat /tmp/gh_checks_err || true
              sleep "$POLL_INTERVAL"
              continue
            fi
            # else: nonzero exit but we DID get JSON (pending/failing) → parse.
          fi

          total=$(printf '%s' "$checks_json" | jq 'length')

          if [ "$total" -eq 0 ]; then
            # No checks on this PR. Distinguish "repo genuinely has no CI"
            # from "CI has not registered its checks yet" by requiring the
            # no-checks state to persist for a grace window before we treat
            # the PR as green. Without this, a just-opened PR could be
            # bypass-merged in the split second before its workflows appear.
            if [ -z "$no_checks_since" ]; then
              no_checks_since="$now"
            fi
            elapsed=$(( now - no_checks_since ))
            if [ "$elapsed" -ge "$NO_CHECKS_GRACE" ]; then
              echo "No checks reported after ${elapsed}s grace; treating as green (mechanical bump)."
              break
            fi
            echo "No checks reported yet (${elapsed}s/${NO_CHECKS_GRACE}s grace); waiting for CI to register."
            sleep "$POLL_INTERVAL"
            continue
          fi

          # Checks exist → reset the no-checks grace tracker in case a prior
          # poll saw none (checks registered late).
          no_checks_since=""

          pending=$(printf '%s' "$checks_json" | jq '[.[] | select(.bucket == "pending")] | length')
          failed=$(printf '%s' "$checks_json" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length')

          if [ "$pending" -gt 0 ]; then
            echo "CI still running: ${pending}/${total} pending; polling again in ${POLL_INTERVAL}s."
            sleep "$POLL_INTERVAL"
            continue
          fi

          # Terminal: nothing pending. "green" == every check settled in a
          # non-failing bucket (pass or skipping); any fail/cancel is red.
          if [ "$failed" -gt 0 ]; then
            echo "ERROR: ${failed}/${total} checks failed or were cancelled on $PR_URL."
            echo "ERROR: Leaving the PR open; not bypass-merging."
            gh pr checks "$PR_URL" || true
            exit 1
          fi

          echo "All ${total} checks green (pass/skipping) on $PR_URL."
          break
        done

        # Green (or intentionally no-CI). Merge via the REST merge endpoint
        # directly, NOT `gh pr merge`. This immediate merge relies on the
        # bot's ruleset bypass membership (bot team 4637420, bypass_mode
        # always) rather than admin: the REST endpoint
        # `PUT /repos/{owner}/{repo}/pulls/{n}/merge` honours the bot's
        # bypass_actors membership, whereas native auto-merge does not.
        # `gh pr merge` cannot be used here: its client-side preflight refuses
        # the merge when required reviews are unmet even for a caller with
        # bypass authority (cli/cli#13388), and its `--admin` escape would
        # require repo admin the bot may not hold — it only reliably holds
        # ruleset bypass via team 4637420. Where the bot is NOT a bypass actor
        # on a target repo, this API merge fails and the step exits nonzero,
        # which is the correct signal for the caller's failure-notify job
        # (same failure semantics as before, just a scoped bypass instead of
        # an admin override).
        #
        # Derive owner/repo/number from the PR URL
        # (https://github.com/<owner>/<repo>/pull/<n>).
        pr_path="${PR_URL#https://github.com/}"   # <owner>/<repo>/pull/<n>
        owner_repo="${pr_path%%/pull/*}"          # <owner>/<repo>
        pr_number="${pr_path##*/pull/}"           # <n>

        echo "Bypass-merging $PR_URL via REST merge API (method=$MERGE_METHOD) as ruleset bypass actor."
        # MERGE_METHOD values (squash|merge|rebase) already match the API's
        # merge_method enum, so no translation is needed.
        gh api --method PUT "repos/${owner_repo}/pulls/${pr_number}/merge" \
          -f "merge_method=${MERGE_METHOD}" >/dev/null

        # The REST merge endpoint does not delete the head branch; do it
        # explicitly. Best-effort: a failure here must NOT fail the step (the
        # merge already succeeded, so branch cleanup is cosmetic).
        head_ref=$(gh pr view "$PR_URL" --json headRefName -q .headRefName 2>/dev/null || true)
        if [ -n "${head_ref:-}" ]; then
          gh api --method DELETE "repos/${owner_repo}/git/refs/heads/${head_ref}" >/dev/null 2>&1 || \
            echo "WARN: could not delete head branch ${head_ref} (merge already succeeded)."
        fi
