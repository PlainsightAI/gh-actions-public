name: Filter Release

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image name (for example plainsightai/openfilter-my-filter)
        required: true
        type: string
      python_versions:
        description: JSON array of Python versions to test
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'
      dockerhub_username:
        description: Docker Hub username for image push
        required: false
        type: string
        default: plainsightai
      source-paths:
        description: |
          Optional newline-separated glob patterns considered substantive
          changes for the release-log check. When set, check-release-log is
          a no-op if the PR touches none of these paths. When unset, every
          PR to main must update RELEASE.md (existing behavior).

          Do NOT include RELEASE.md itself — the downstream step already
          checks that, and including it here creates a tautology where every
          RELEASE.md edit satisfies the gate regardless of substantive change.
        required: false
        type: string
        default: ''
      ignore-paths:
        description: |
          Optional newline-separated glob patterns of paths that do NOT count
          as substantive for the release-log check. When set, check-release-log
          is a no-op if the PR changes ONLY files matching these globs. Can
          be combined with source-paths; both filters apply.
        required: false
        type: string
        default: ''
      forward_secrets_as_env:
        description: |
          Comma-separated names of inherited secrets to forward as env vars
          into the publish-docker job. Requires `secrets: inherit` on the
          caller. Pair with `build_secrets` to expose them to BuildKit at
          build time. Mirrors the same input on filter-release-premium.yaml.
        required: false
        type: string
        default: ''
      build_secrets:
        description: |
          Newline-separated lines passed to docker/build-push-action's
          `secret-envs:` input. Each line maps a BuildKit secret ID to an
          env var: `SECRET_ID=ENV_VAR`.

          The env var MUST exist in the publish-docker job — typically via
          `forward_secrets_as_env` + `secrets: inherit` on the caller.

          Example for a Dockerfile that uses
          `RUN --mount=type=secret,id=hf_token`:

            forward_secrets_as_env: HF_TOKEN
            build_secrets: |
              hf_token=HF_TOKEN
        required: false
        type: string
        default: ''
      platforms:
        description: |
          Comma-separated list of target platforms passed to
          docker/build-push-action's `platforms:` input. Defaults to
          `linux/amd64,linux/arm64` so existing callers see no behavior
          change.

          Override for filters whose base image isn't multi-arch (e.g.
          CUDA-based filters using `pytorch/pytorch:*-cuda*`, which ships
          amd64-only) or for callers that need to opt out of arm64
          emulation builds for cost/time reasons.

          Example for a CUDA-based filter:

            platforms: linux/amd64
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      schema_module:
        description: >
          Importable Python module path of the filter (e.g.
          `filter_sam3_detector.filter`). When set, the publish-docker job
          emits the filter's config schema (and output schema, if declared)
          via `python -m openfilter.cli emit-schema` inside the pushed
          image, and attaches them as OCI 1.1 referrer artifacts on the
          image manifest (FILTER-453). When unset (default), no schema
          work happens — back-compat for filters that have not migrated
          to the typed FilterConfigBase / FilterOutputSchema SDK.
        required: false
        type: string
        default: ''
      schema_class:
        description: >
          Optional `ClassName` for emit-schema disambiguation when the
          module declares more than one matching base subclass. Passed
          through as the `module:Class` qualifier to `openfilter
          emit-schema`. Ignored when schema_module is empty.
        required: false
        type: string
        default: ''
    secrets:
      PYPI_API_TOKEN:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      GH_BOT_USER_PAT:
        required: false
      SLACK_WEBHOOK_URL:
        description: |
          Optional Slack incoming-webhook URL — passed through to the
          cascade-pipeline-bumps reusable workflow (PLAT-1052) for the
          fleet-deduplicated failure notification. Missing → cascade
          failures surface only in the Actions run summary.
        required: false

permissions:
  contents: write
  pull-requests: read

# Queue concurrent runs instead of cancelling — a partial release (PyPI
# wheel published, Docker image missing) is worse than waiting.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release-log:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Delegate to the sibling composite so the source-paths/ignore-paths
      # gate logic lives in one place for public consumers. The composite
      # lives in this same (public) repo, so fork PRs to downstream public
      # filter repos can reach it — no visibility regression.
      - name: Check release log
        uses: PlainsightAI/gh-actions-public/check-release-log@main
        with:
          source-paths: ${{ inputs.source-paths }}
          ignore-paths: ${{ inputs.ignore-paths }}

  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ${{ fromJSON(inputs.python_versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Run tests
        run: make test

  # PR-time prevention path (DT-146 pattern). Mirrors publish-docker's build
  # preamble with `load: true` + single-platform so the dry-run exercises the
  # same Dockerfile + composite path as the real publish, but skips the push
  # and the OCI-attach step. Catches schema misconfigurations and Dockerfile
  # build regressions before a release is being cut.
  dry-run-publish:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Filter Dockerfiles typically pip-install `<package>==$(cat VERSION)`
      # from PyPI. On a version-bump PR the new wheel hasn't been published
      # yet, so the dry-run build can't resolve `<pkg>==<new-version>` and
      # fails with "Could not find a version that satisfies the requirement".
      # Swap the workspace VERSION for the base branch's value before the
      # build — we still exercise the Dockerfile against the latest published
      # wheel, which is what `dry-run-publish` is meant to catch. The real
      # publish path (post-merge) uses the bumped VERSION and the freshly
      # published wheel, so nothing is bypassed there.
      - name: Use base-branch VERSION for dry-run when VERSION bumped on PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ ! -f VERSION ]; then
            echo "No VERSION file; nothing to override."
            exit 0
          fi
          if ! git fetch --depth=1 origin "$BASE_REF"; then
            echo "::warning::Could not fetch base '${BASE_REF}'; dry-run will build with PR VERSION."
            exit 0
          fi
          BASE_VERSION_RAW=$(git show "origin/${BASE_REF}:VERSION" 2>/dev/null || true)
          PR_VERSION_RAW=$(cat VERSION 2>/dev/null || true)
          BASE_VERSION=$(printf '%s' "$BASE_VERSION_RAW" | tr -d ' \t\r\n')
          PR_VERSION=$(printf '%s' "$PR_VERSION_RAW" | tr -d ' \t\r\n')
          if [ -z "$BASE_VERSION" ]; then
            echo "Base branch has no VERSION; dry-run will build with PR VERSION."
            exit 0
          fi
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "VERSION unchanged on PR; no override."
            exit 0
          fi
          echo "::notice::VERSION bumped on PR (${PR_VERSION}) — overriding workspace VERSION with base (${BASE_VERSION}) for dry-run Docker build so the pip install can resolve against the published wheel. The real publish path uses ${PR_VERSION} after merge."
          printf '%s\n' "$BASE_VERSION" > VERSION
        shell: bash

      - name: "PreAction Disk-Cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No `docker login` here on purpose: `load: true` below keeps the image
      # in the local daemon and the composite runs against `localhost/filter`,
      # so nothing pulls or pushes. Skipping login also lets fork PRs run this
      # job — `DOCKERHUB_TOKEN` isn't passed to fork workflows.

      - name: Forward inherited secrets to env
        if: inputs.forward_secrets_as_env != ''
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
          NAMES: ${{ inputs.forward_secrets_as_env }}
        run: |
          IFS=',' read -ra names <<< "$NAMES"
          for name in "${names[@]}"; do
            name="${name//[[:space:]]/}"; [ -z "$name" ] && continue
            value=$(printf '%s' "$ALL_SECRETS" | jq -r --arg k "$name" '.[$k] // ""')
            [ -z "$value" ] && { echo "::warning::secret '$name' listed in forward_secrets_as_env but not found in inherited secrets context"; continue; }
            echo "::add-mask::$value"
            delim="ghsecret_$(openssl rand -hex 8)"
            { echo "${name}<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >> "$GITHUB_ENV"
          done

      # The build context is this checkout, so write the build commit here and
      # the standard Dockerfile's `COPY . .` picks it up; the Dockerfile renames
      # GITHUB_SHA -> VERSION_SHA, which openfilter reads as the version_sha
      # lineage facet. Private/premium write this in their build job too; do it
      # here so the public docker path behaves the same.
      - name: Write Git SHA to GITHUB_SHA
        run: echo "${{ github.sha }}" > GITHUB_SHA

      # Single-platform load build — image stays in the local daemon under a
      # local-only namespace (no production repo coordinates), so the
      # composite's `docker run` resolves locally instead of pulling.
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: localhost/filter:pr-${{ github.event.number }}
          secret-envs: ${{ inputs.build_secrets }}
          cache-from: type=gha

      # Emit-only — attach is skipped via dry_run. No-op when schema_module
      # is empty (filters that haven't migrated to FilterConfigBase).
      - name: Emit schemas (dry-run; no attach)
        uses: PlainsightAI/gh-actions-public/attach-filter-schemas@main
        with:
          image: localhost/filter
          version: pr-${{ github.event.number }}
          dry_run: "true"
          schema_module: ${{ inputs.schema_module }}
          schema_class: ${{ inputs.schema_class }}

      # Generate the SBOM against the locally-loaded image but do NOT attest (nothing is
      # pushed at PR time). This catches a syft invocation or reference problem here, at PR
      # time, instead of at the first real release — mirroring the emit-only schema step.
      # SHA-pinned (same build as the release path): the "Forward inherited secrets to env"
      # step earlier in this job writes the caller's inherited secrets into $GITHUB_ENV, so
      # they are visible to every later step here, including this one.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      - name: SBOM (dry-run; no attest)
        shell: bash
        run: |
          set -euo pipefail
          syft "localhost/filter:pr-${{ github.event.number }}" -o spdx-json=sbom.spdx.json
          test -s sbom.spdx.json

  create-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: run-tests
    outputs:
      is_release_created: ${{ steps.release_meta.outputs.is_release_created }}
      version: ${{ steps.release_meta.outputs.version }}
      is_production_release: ${{ steps.release_meta.outputs.is_production_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run changelog parser
        id: changelog
        uses: PlainsightAI/changelog-parser-action@main
        with:
          path: RELEASE.md

      - name: Store changelog version
        run: echo "CHANGELOG_VERSION=${{ steps.changelog.outputs.version }}" >> "$GITHUB_ENV"
        shell: bash

      - name: Check VERSION file (if exists)
        shell: bash
        run: |
          if [[ -f "VERSION" ]]; then
            version_file="$(tr -d '[:space:]' < VERSION)"
            if [[ "$version_file" != "$CHANGELOG_VERSION" ]]; then
              echo "VERSION mismatch! VERSION file: $version_file, RELEASE.md: $CHANGELOG_VERSION"
              exit 1
            fi
          else
            echo "No VERSION file found, skipping version check."
          fi

      - name: Check if release tag exists
        id: check_tag
        uses: mukunku/tag-exists-action@v1.7.0
        with:
          tag: "${{ env.CHANGELOG_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.description }}
        shell: bash
        run: |
          echo "$RELEASE_NOTES" > release-notes.md
          gh release create "${{ env.CHANGELOG_VERSION }}" \
            --title "Release ${{ env.CHANGELOG_VERSION }}" \
            --notes-file release-notes.md

      - name: Export release metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ steps.check_tag.outputs.exists }}" == "false" ]]; then
            echo "is_release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_created=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${{ env.CHANGELOG_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "is_production_release=${{ steps.changelog.outputs.isProductionRelease }}" >> "$GITHUB_OUTPUT"

  prepare-pypi-publish:
    runs-on: ubuntu-latest
    needs: create-release
    if: needs.create-release.outputs.is_release_created == 'true'
    outputs:
      package_name: ${{ steps.meta.outputs.package_name }}
      package_version: ${{ steps.meta.outputs.package_version }}
      already_exists: ${{ steps.check_pypi.outputs.already_exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Write Git SHA to VERSION_SHA
        run: echo "${{ github.sha }}" > VERSION_SHA

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel
        run: python -m build --wheel

      - name: Extract package metadata
        id: meta
        shell: bash
        run: |
          dist_file=$(ls dist/*.whl | head -n1)
          unzip -p "$dist_file" "*.dist-info/METADATA" > METADATA
          echo "package_name=$(grep '^Name:' METADATA | cut -d ' ' -f2-)" >> "$GITHUB_OUTPUT"
          echo "package_version=$(grep '^Version:' METADATA | cut -d ' ' -f2-)" >> "$GITHUB_OUTPUT"
          rm -f METADATA

      - name: Check if version already on PyPI
        id: check_pypi
        shell: bash
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${{ steps.meta.outputs.package_name }}/${{ steps.meta.outputs.package_version }}/json")
          if [[ "$response" -eq 200 ]]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect built wheel
        shell: bash
        run: |
          dist_file=$(ls dist/*.whl 2>/dev/null | head -n1)
          if [[ -z "$dist_file" ]]; then
            echo "No wheel file found in ./dist"
            exit 1
          fi
          twine check "$dist_file"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-dist
          path: dist/

  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: prepare-pypi-publish
    if: needs.prepare-pypi-publish.outputs.already_exists == 'false'
    environment:
      name: pypi-release
      url: https://pypi.org/project/${{ needs.prepare-pypi-publish.outputs.package_name }}/
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel-dist
          path: dist/

      - name: Publish wheel to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.PLAINSIGHT_PYPI_TOKEN }}
        run: python -m twine upload dist/*.whl

  publish-docker:
    runs-on: ubuntu-latest
    needs: [create-release, prepare-pypi-publish, publish-to-pypi]
    if: needs.create-release.outputs.is_release_created == 'true' && (needs.publish-to-pypi.result == 'success' || needs.publish-to-pypi.result == 'skipped')
    # id-token: write lets the keyless cosign SBOM attestation steps below mint a
    # short-lived OIDC identity token instead of using a long-lived signing key. This
    # block on the reusable workflow is sufficient on its own — callers need not grant
    # id-token. The sibling security-scan.yaml uses the same pattern (its own
    # `id-token: write`) and its filter callers, which declare no `permissions:` block at
    # all, mint OIDC fine (google-github-actions/auth). The only way a caller would break
    # this is by setting its OWN restrictive `permissions:` block without id-token, which
    # the filter create-release.yaml callers do not do.
    permissions:
      contents: read
      id-token: write
    # Third-party actions in this job are pinned by commit SHA, not a floating tag: the job
    # holds id-token: write, so its OIDC token is in every step's environment, and a
    # compromised mutable tag on any of them could mint a Fulcio cert as this repo. Same
    # reasoning the cosign/syft installers are already SHA-pinned. (attach-filter-schemas
    # stays @main below — it is this repo's own action, so pinning it guards against nothing
    # a push to this repo couldn't already do, and would add a self-referential SHA treadmill.)
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "PreAction Disk-Cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_ACCESS_TOKEN }}

      # Forward caller-listed inherited secrets into $GITHUB_ENV so subsequent
      # steps (notably docker/build-push-action with build_secrets:
      # id=<id>,env=<NAME>) can see them. GitHub Actions doesn't allow callers
      # to inject env into reusable-workflow steps, so this loop is the
      # workaround: caller passes names via forward_secrets_as_env +
      # secrets: inherit, we resolve each via toJson(secrets) and write to
      # $GITHUB_ENV with masking. Mirrors the same step in
      # filter-release-premium.yaml.
      - name: Forward inherited secrets to env
        if: inputs.forward_secrets_as_env != ''
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
          NAMES: ${{ inputs.forward_secrets_as_env }}
        run: |
          IFS=',' read -ra names <<< "$NAMES"
          for name in "${names[@]}"; do
            name="${name//[[:space:]]/}"; [ -z "$name" ] && continue
            value=$(printf '%s' "$ALL_SECRETS" | jq -r --arg k "$name" '.[$k] // ""')
            [ -z "$value" ] && { echo "::warning::secret '$name' listed in forward_secrets_as_env but not found in inherited secrets context"; continue; }
            echo "::add-mask::$value"
            delim="ghsecret_$(openssl rand -hex 8)"
            { echo "${name}<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >> "$GITHUB_ENV"
          done

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.docker_image }}
          tags: |
            # Intentional dummy tag: we only consume labels from this action.
            type=raw,value=skip

      # Write the build commit into this checkout (the build context) so the
      # standard Dockerfile's `COPY . .` picks it up and its GITHUB_SHA ->
      # VERSION_SHA rename feeds openfilter's version_sha lineage facet —
      # matching the private/premium build jobs.
      - name: Write Git SHA to GITHUB_SHA
        run: echo "${{ github.sha }}" > GITHUB_SHA

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.docker_image }}:${{ needs.prepare-pypi-publish.outputs.package_version }}
            ${{ inputs.docker_image }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          secret-envs: ${{ inputs.build_secrets }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No-op when schema_module is empty — back-compat for filters that
      # haven't migrated to FilterConfigBase. The composite's
      # docker run --entrypoint python pulls the runner's-platform variant
      # from Docker Hub (we're already logged in above) since multi-platform
      # build-push doesn't load the image into the local daemon.
      - name: Attach config + output schemas (FILTER-453)
        uses: PlainsightAI/gh-actions-public/attach-filter-schemas@main
        with:
          image: ${{ inputs.docker_image }}
          version: ${{ needs.prepare-pypi-publish.outputs.package_version }}
          schema_module: ${{ inputs.schema_module }}
          schema_class: ${{ inputs.schema_class }}

      # ----- Supply-chain: SBOM + signed attestation --------------------------
      # Runs LAST (after the schema attach), so an attest/Sigstore failure — the
      # newest, most-likely-to-flake step — cannot stop the older, independently
      # useful schema-attach from completing. Generate an SPDX SBOM and attach it
      # as a keyless, signed in-toto attestation (Sigstore, via the job's GitHub
      # OIDC token — no long-lived key). Public images log to the Rekor
      # transparency log normally. The grype-release-metric daily scanner reads
      # just this attestation (KBs) to re-scan the released image without pulling
      # it. These two run in a job holding id-token: write and cosign signs, so a
      # compromised mutable tag on either could mint a Fulcio cert as this repo's
      # identity — the load-bearing exception to the always-latest convention: pin
      # both by commit SHA. cosign-release pins the cosign binary (v2 flag spelling);
      # syft-version pins the SBOM generator so its output can't drift silently.
      # continue-on-error like the attest step: these are plain release-asset downloads that
      # run after the image + wheel are published, so a network blip fetching cosign/syft must
      # not fail the release path (which would withhold the cascade / docs sync).
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.2
      - name: Install syft
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      # continue-on-error: a Sigstore/Fulcio flake here (the newest, most-likely-to-flake step,
      # after the image + wheel are already published) does not fail publish-docker, so
      # cascade-gate and trigger-docs-sync — which gate on needs.publish-docker.result ==
      # 'success' — are not withheld by an attest outage. Ordering alone can't protect those
      # downstream jobs; this can. The trade-off is that continue-on-error makes the JOB green
      # even when this step failed (it does NOT show red on the checks board), so the "Record
      # SBOM attestation outcome" step below reads steps.attest.outcome and emits a ::warning::
      # + job-summary line when it isn't success — otherwise a release that shipped an
      # unattested image would look identical to one that attested.
      - name: SBOM + keyless attest
        id: attest
        continue-on-error: true
        shell: bash
        env:
          IMAGE: ${{ inputs.docker_image }}
          VERSION: ${{ needs.prepare-pypi-publish.outputs.package_version }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:${VERSION}"
          # syft against a manifest-list tag only catalogs one platform, so
          # multi-arch images need one SBOM per target platform. Each is attested
          # to the same (index) digest; the scanner reads every spdxjson attestation.
          IFS=',' read -ra PLATS <<< "${PLATFORMS}"
          for plat in "${PLATS[@]}"; do
            plat="$(echo "$plat" | tr -d '[:space:]')"
            [ -n "$plat" ] || continue
            sbom="sbom.$(echo "$plat" | tr '/' '-').spdx.json"
            syft "${REF}" --platform "${plat}" -o spdx-json="${sbom}"
            # --type spdxjson sets predicateType https://spdx.dev/Document (scanner filter).
            cosign attest --yes --type spdxjson --predicate "${sbom}" "${REF}"
          done
      # Because the attest step is continue-on-error, a green publish-docker job could have
      # shipped an image with no (or, since `set -euo pipefail` aborts the loop mid-way, only
      # partial) SBOM attestation. Surface that: read the step outcome and, when it isn't
      # success, annotate the run (::warning::) and the job summary so an unattested release is
      # distinguishable from an attested one without re-failing the publish. `if: always()` so
      # it runs even after the "failed" step.
      - name: Record SBOM attestation outcome
        if: always()
        shell: bash
        env:
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          IMAGE: ${{ inputs.docker_image }}
          VERSION: ${{ needs.prepare-pypi-publish.outputs.package_version }}
        run: |
          set -euo pipefail
          if [ "$ATTEST_OUTCOME" = "success" ]; then
            echo "✅ SBOM attestation attached for ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::SBOM attestation did NOT complete (step outcome: ${ATTEST_OUTCOME:-skipped}); ${IMAGE}:${VERSION} was published WITHOUT a complete signed SBOM attestation. See the 'SBOM + keyless attest' step log."
            echo "⚠️ SBOM attestation FAILED (outcome: ${ATTEST_OUTCOME:-skipped}) — ${IMAGE}:${VERSION} published WITHOUT a complete signed SBOM." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Probe whether the cascade can run before invoking the called
  # workflow — GitHub Actions has no first-class "is this secret set?"
  # check, and the cascade workflow declares GH_BOT_USER_PAT as required.
  # An always-fail "required secret missing" run for filter-* repos that
  # haven't onboarded the bot would be noise; gating via this output
  # keeps those repos' releases green.
  cascade-gate:
    runs-on: ubuntu-latest
    needs: [create-release, publish-docker]
    if: needs.create-release.outputs.is_release_created == 'true' && needs.publish-docker.result == 'success'
    outputs:
      should_cascade: ${{ steps.probe.outputs.should_cascade }}
    steps:
      - id: probe
        env:
          GH_BOT_USER_PAT: ${{ secrets.GH_BOT_USER_PAT }}
          IS_PRODUCTION_RELEASE: ${{ needs.create-release.outputs.is_production_release }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_BOT_USER_PAT:-}" ]]; then
            echo "::notice::GH_BOT_USER_PAT not configured; pipeline-bump cascade (PLAT-1052) will not run for this release."
            echo "should_cascade=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Mirror the first-level cascade's gating: only production
          # releases cascade. A dev/prerelease tag publishing a
          # `*-dev` Docker image should not rewrite production consumer
          # pins to a non-prod coordinate.
          if [[ "${IS_PRODUCTION_RELEASE}" != "true" ]]; then
            echo "Release is not flagged production (is_production_release='${IS_PRODUCTION_RELEASE}'); skipping cascade."
            echo "should_cascade=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_cascade=true" >> "$GITHUB_OUTPUT"

  # Second-level cascade: bump filter image pins in every consumer that
  # tracks this filter (currently openfilter-pipelines-controller; the
  # consumer set is the bump matrix in cascade-pipeline-bumps.yaml).
  # Mirrors the first-level cascade's contract (matrix fan-out,
  # fail-fast: false, Slack-on-failure). See docs/cascade/consumer-surface.md
  # for each consumer's pin shapes. PLAT-1052.
  cascade-pipeline-bumps:
    needs: [prepare-pypi-publish, cascade-gate]
    if: needs.cascade-gate.outputs.should_cascade == 'true'
    uses: PlainsightAI/gh-actions-public/.github/workflows/cascade-pipeline-bumps.yaml@main
    with:
      docker_image: ${{ inputs.docker_image }}
      version: ${{ needs.prepare-pypi-publish.outputs.package_version }}
    secrets: inherit

  trigger-docs-sync:
    runs-on: ubuntu-latest
    needs: [create-release, publish-docker]
    if: needs.create-release.outputs.is_release_created == 'true' && needs.publish-docker.result == 'success'
    steps:
      - name: Trigger docs sync dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_USER_PAT }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "GH_BOT_USER_PAT not provided, skipping docs sync dispatch."
            exit 0
          fi

          gh api repos/PlainsightAI/gh-actions/dispatches \
            -f event_type=sync-filter-docs \
            -f "client_payload[repository]=${{ github.repository }}" \
            -f "client_payload[tag]=${{ needs.create-release.outputs.version }}" \
            -f "client_payload[is_production_release]=${{ needs.create-release.outputs.is_production_release }}"
