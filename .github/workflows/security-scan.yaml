name: Security Scan

on:
  workflow_call:
    inputs:
      language:
        description: >-
          Ecosystem of the repo being scanned. `python` (default) sets up Python and runs
          `make install` so the resolved dependency tree is on disk before Grype scans it,
          once per resolved Python version. `go` (or any non-python value) skips that Python
          setup and scans the source tree directly (Grype reads go.mod/go.sum natively), a
          single time. The Grype run, the ignore/CVE-policy merge, and `--fail-on` are shared
          across both, so there is one source of truth for the CVE policy (no per-language drift).
        required: false
        type: string
        default: python
      python_versions:
        description: >-
          Explicit JSON array of Python versions to scan (ignored unless language=python).
          Leave empty (the default) to DERIVE the matrix from the repo's own `requires-python`
          in pyproject.toml, clamped to [python_floor, python_ceiling] — so each repo scans
          exactly the versions it supports with no per-repo override to keep in sync. Pass an
          explicit array only to override that (e.g. a service with no pyproject.toml).
        required: false
        type: string
        default: ''
      python_floor:
        description: Lowest Python minor to scan when deriving from requires-python (e.g. "3.10").
        required: false
        type: string
        default: '3.10'
      python_ceiling:
        description: >-
          Highest Python minor to scan when deriving. Bump this in ONE place when a new Python
          ships and every consumer whose requires-python allows it picks it up fleet-wide.
        required: false
        type: string
        default: '3.14'
      grype_version:
        description: Grype version to use
        required: false
        type: string
        default: v0.103.0
      fail_on:
        description: Severity threshold to fail on (critical, high, medium, low)
        required: false
        type: string
        default: critical
      filter_name:
        description: Name passed to Grype --name (defaults to repository name)
        required: false
        type: string
      only_fixed:
        description: Only report vulnerabilities with known fixes
        required: false
        type: boolean
        default: true
      ignore_cves:
        description: >-
          Comma-separated CVE/GHSA IDs to ignore. Merged into a temporary
          Grype config passed via --config (the repo's own .grype.yaml is
          read but never modified). Empty by default; pass IDs explicitly to
          suppress transitive-dependency CVEs that have no upstream fix yet.
        required: false
        type: string
      gcloud_auth:
        description: Enable GCloud auth for private dependency installation (premium/private filters)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  # Resolve the Python matrix once, up front. For a python repo that passes no explicit
  # python_versions, derive it from the repo's own requires-python (clamped to
  # [python_floor, python_ceiling]) so each repo scans exactly the versions it supports —
  # nothing to keep in sync per repo, and a new Python is picked up fleet-wide by bumping
  # python_ceiling. An explicit python_versions input overrides the derivation (e.g. a
  # service with no pyproject.toml). Non-python repos resolve to a single ["-"] run.
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.derive.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Derive Python matrix
        id: derive
        shell: bash
        env:
          LANGUAGE: ${{ inputs.language }}
          OVERRIDE: ${{ inputs.python_versions }}
          FLOOR: ${{ inputs.python_floor }}
          CEILING: ${{ inputs.python_ceiling }}
        run: |
          if [ "$LANGUAGE" != "python" ]; then
            echo 'versions=["-"]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$OVERRIDE" ]; then
            echo "versions=$OVERRIDE" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, os, json
          floor_i = int(os.environ["FLOOR"].split(".")[1])
          ceil_i = int(os.environ["CEILING"].split(".")[1])
          rp = ""
          try:
              with open("pyproject.toml") as fh:
                  m = re.search(r'''requires-python\s*=\s*["']([^"']+)''', fh.read())
                  rp = m.group(1) if m else ""
          except FileNotFoundError:
              pass
          fm = re.search(r'>=\s*3\.(\d+)', rp)
          cm = re.search(r'<\s*3\.(\d+)', rp)
          lo = max(int(fm.group(1)) if fm else floor_i, floor_i)
          hi = min((int(cm.group(1)) - 1) if cm else ceil_i, ceil_i)
          versions = [f"3.{n}" for n in range(lo, hi + 1)] or [f"3.{ceil_i}"]
          print("versions=" + json.dumps(versions))
          PY

  grype:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Resolved by the resolve-matrix job: the derived (or explicitly overridden) Python
        # versions for a python repo, or a single ["-"] run for a go.mod/source scan.
        python: ${{ fromJSON(needs.resolve-matrix.outputs.versions) }}
    steps:
      - name: "PreAction Disk-Cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true

      - name: Checkout code
        uses: actions/checkout@v6

      # Python is needed to (a) install deps for a python repo, and (b) run the ignore/CVE
      # merge script below. Skip it for a non-python repo that passes no ignore_cves.
      - name: Set up Python
        if: inputs.language == 'python' || inputs.ignore_cves != ''
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.language == 'python' && matrix.python || '3.12' }}

      - name: Authenticate to Google Cloud
        if: inputs.gcloud_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCLOUD_GITHUB_CI_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        if: inputs.gcloud_auth
        uses: google-github-actions/setup-gcloud@v3

      # Python only: install the resolved dependency tree so `grype dir:.` sees it. A go.mod
      # repo needs nothing here — Grype reads go.mod/go.sum from the checkout directly.
      - name: Create virtual environment and install dependencies
        if: inputs.language == 'python'
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          make install

      - name: Resolve filter name
        id: filter_name
        shell: bash
        env:
          RAW_FILTER_NAME: ${{ inputs.filter_name }}
        run: |
          name="${RAW_FILTER_NAME:-${GITHUB_REPOSITORY##*/}}"
          if [[ "$name" == *$'\n'* || "$name" == *$'\r'* ]]; then
            echo "Invalid filter_name: must not contain newline characters" >&2
            exit 1
          fi
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - name: Download Grype
        uses: anchore/scan-action/download-grype@v7
        id: grype
        with:
          grype-version: ${{ inputs.grype_version }}

      - name: Configure Grype ignores
        if: inputs.ignore_cves != ''
        shell: bash
        env:
          IGNORE_CVES: ${{ inputs.ignore_cves }}
        run: |
          python -m pip install --quiet PyYAML
          cfg="/tmp/grype-workflow.yaml"

          python - "$cfg" <<'PYEOF'
          import re, sys, os, yaml

          cfg_path = sys.argv[1]
          ignore_cves = os.environ["IGNORE_CVES"]

          # Parse and validate entries
          CVE_RE = re.compile(r"^CVE-\d{4}-\d+$")
          GHSA_RE = re.compile(r"^GHSA-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$")

          entries = []
          for raw in ignore_cves.split(","):
              trimmed = raw.strip()
              if not trimmed:
                  continue
              if not trimmed.isprintable():
                  print(f"Invalid ignore_cves entry '{trimmed}': must not contain control characters", file=sys.stderr)
                  sys.exit(1)
              if not CVE_RE.match(trimmed) and not GHSA_RE.match(trimmed):
                  print(f"Invalid ignore_cves entry '{trimmed}': expected CVE-YYYY-NNNN... or GHSA-xxxx-xxxx-xxxx", file=sys.stderr)
                  sys.exit(1)
              entries.append(trimmed)

          if not entries:
              sys.exit(0)

          # Load existing config or start fresh
          config = {}
          if os.path.isfile(".grype.yaml"):
              print("Found existing .grype.yaml — merging with workflow ignores")
              with open(".grype.yaml") as f:
                  config = yaml.safe_load(f) or {}

          # Merge ignore entries
          existing_ignores = config.get("ignore") or []
          if not isinstance(existing_ignores, list):
              print(f"WARNING: .grype.yaml 'ignore' key is {type(existing_ignores).__name__}, expected list — overwriting", file=sys.stderr)
              existing_ignores = []
          existing_ignores.extend({"vulnerability": e} for e in entries)
          config["ignore"] = existing_ignores

          with open(cfg_path, "w") as f:
              yaml.safe_dump(config, f, default_flow_style=False, sort_keys=False)

          print(f"Added {len(entries)} ignore(s): {', '.join(entries)}")
          PYEOF

          if [[ -f "$cfg" ]]; then
            echo "GRYPE_CONFIG=$cfg" >> "$GITHUB_ENV"
          fi

      - name: Run Grype security scan
        shell: bash
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
          GRYPE_NAME: ${{ steps.filter_name.outputs.name }}
          FAIL_ON: ${{ inputs.fail_on }}
          ONLY_FIXED: ${{ inputs.only_fixed }}
        run: |
          args=(--name "$GRYPE_NAME" -o table --fail-on "$FAIL_ON")
          if [[ "$ONLY_FIXED" == "true" ]]; then
            args+=(--only-fixed)
          fi
          if [[ -n "${GRYPE_CONFIG:-}" ]]; then
            args+=(--config "$GRYPE_CONFIG")
          fi
          "$GRYPE_CMD" "${args[@]}" dir:.
